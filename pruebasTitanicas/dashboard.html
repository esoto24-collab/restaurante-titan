<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Grid SVG</title>
    <style>
      * {
        font-family:
          'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva,
          Verdana, sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 0.2fr 1fr;
        grid-template-rows: 1fr;
        min-height: 100dvh;
        grid-template-areas: 'aside main';
        margin: 0px;
      }

      aside {
        grid-area: aside;
      }

      main {
        padding: 20px;
        display: grid;
        gap: 15px;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(4, 1fr);
        grid-template-areas:
          'ganancias ganancias grafica grafica grafica grafica'
          'pedidos pedidos grafica grafica grafica grafica'
          'top_menu top_menu top_menu menu menu trabajadores'
          'top_menu top_menu top_menu clientes clientes clientes'; /* Fila 4 completada */
      }


      main > div {
        background-color: green;
        display: flex; 
      }

      .ganancias {
        grid-area: ganancias;
        background-color: chocolate;
      }

      .pedidos {
        grid-area: pedidos;
      }

      .grafica_ingresos {
        grid-area: grafica;
        background-color: red;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
        background-color: white;
        border: 1px solid black;
      }

      .top {
        grid-area: top_menu;
        background-color: darkgray;
      }

      .menu {
        grid-area: menu;
      }

      .trabajadores {
        grid-area: trabajadores;
        background-color: blueviolet;
      }

      .clientes {
        grid-area: clientes;
      }

      ul {
        list-style: none;
        display: flex;
        flex-flow: column;
        gap: 20px;
      }

      li {
        font-size: x-large;
      }
    </style>
  </head>
  <body>
    <aside>
      <ul>
        <li>Dashboard</li>
        <li>Analisis</li>
        <li>Pedidos</li>
        <li>Menu</li>
        <li>Clientes</li>
        <li>Salir</li>
      </ul>
    </aside>
    <main>
      <div class="ganancias">Ganancias</div>
      <div class="pedidos">Pedidos</div>

      <div class="grafica_ingresos">
        <svg></svg>
      </div>

      <div class="top">
        <svg></svg>
      </div>
      <div class="menu">Numero de platillos</div>
      <div class="trabajadores">Numero de trabajadores</div>
      <div class="clientes">Numero de clientes</div>
    </main>
  </body>
</html>
