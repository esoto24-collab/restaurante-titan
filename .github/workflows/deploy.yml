name: Desplegar sitio estatico en Pages

on:
  push:
    branches: ["main"] 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto (carpeta src) # Liada parda por no saber usar github deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4