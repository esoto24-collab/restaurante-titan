<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Menu Titanico</title>
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <style>
      /* Espacio inferior para que .barra-compra no tape el footer ni las últimas tarjetas */
      footer {
        padding-bottom: calc(
          5.5rem + env(safe-area-inset-bottom, 0px)
        );
      }

      .barra-compra {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.25rem
          calc(0.75rem + env(safe-area-inset-bottom, 0px));
        background-color: var(--color-red-dark);
        border-top: var(--border-md);
        box-shadow: 0 -4px 0 var(--element-color-black);
        color: #ffffff;
        transition:
          transform 200ms ease,
          opacity 200ms ease;

        &.ocultar {
          transform: translateY(100%);
          opacity: 0;
          pointer-events: none;
        }

        .barra-compra__resumen {
          display: flex;
          flex-direction: column;
          gap: 0.125rem;
        }

        .barra-compra__cantidad {
          font-family: var(--font-text);
          font-size: 0.875rem;
          opacity: 0.9;
        }

        .barra-compra__total {
          font-family: var(--font-title);
          font-size: clamp(1.1rem, 1rem + 0.5vw, 1.4rem);
          color: var(--color-yellow);
          letter-spacing: 0.02em;
        }

        .barra-compra__boton {
          font-family: var(--font-title);
          font-size: 1rem;
          padding: 0.65rem 1.5rem;
          background-color: var(--color-yellow);
          color: var(--element-color-black);
          border: var(--border-md);
          border-radius: var(--radio-medio);
          box-shadow: var(--sombra-media);
          cursor: pointer;
          transition:
            transform 120ms ease,
            box-shadow 120ms ease;

          &:hover:not(:disabled) {
            transform: translate(-1px, -1px);
            box-shadow: var(--sombra-media-hover);
          }

          &:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--element-color-black);
          }

          &:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
          }
        }
      }
    </style>
  </head>
  <body>
    <header>
      <titan-titulo></titan-titulo>
      <div class="botones-especiales">
        <functional-card
          class="botones-especiales__tema ocultar"
          imagen="/src/assets/svg/moon.svg"
          id="tema"
        ></functional-card>
        <functional-card
          id="menu-hamburguesa"
          imagen="/src/assets/svg/menu.svg"
        ></functional-card>
      </div>
    </header>

    <main id="contenido-main" class="menu">
      <div class="informacion">
        <h1>Menu Titanico</h1>
        <em>Mira nuestras deliciosas comidas</em>
      </div>
      <h3>Categorias</h3>
      <div class="opciones-categorias">
        <opcion-categoria texto="Hamburguesa"></opcion-categoria>
        <opcion-categoria texto="Pizza"></opcion-categoria>
        <opcion-categoria texto="Papas"></opcion-categoria>
      </div>
      <div class="comidas">
        <comida-card></comida-card>
        <comida-card></comida-card>
        <comida-card></comida-card>
        <comida-card></comida-card>
        <comida-card></comida-card>
        <comida-card></comida-card>
        <comida-card></comida-card>
      </div>
    </main>

    <footer>
      <strong
        >© 1892 TITAN ENTERPRISES, INC. TODOS LOS DERECHOS
        RESERVADOS.</strong
      >
    </footer>

    <div class="barra-lateral ocultar" id="barra-lateral">
      <div class="barra-lateral__titulares">
        <titan-titulo></titan-titulo>
        <functional-card
          imagen="/src/assets/svg/error.svg"
          id="salir-barra"
        ></functional-card>
      </div>
      <ul>
        <li>
          <opcion-menu
            imagen="/src/assets/svg/home.svg"
            texto="Inicio"
          ></opcion-menu>
        </li>
        <li>
          <opcion-menu
            imagen="/src/assets/svg/list-menu-2.svg"
            texto="Menu"
          ></opcion-menu>
        </li>
        <li>
          <opcion-menu
            imagen="/src/assets/svg/cup-2.svg"
            texto="Records"
          ></opcion-menu>
        </li>
      </ul>
      <hr />
      <ul>
        <li>
          <opcion-menu
            imagen="/src/assets/svg/crear-cuenta.svg"
            texto="Crear cuenta"
          >
          </opcion-menu>
        </li>
        <li>
          <opcion-menu
            imagen="/src/assets/svg/log-in.svg"
            texto="Iniciar Sesion"
          >
          </opcion-menu>
        </li>
      </ul>
      <hr />
      <ul>
        <li>
          <opcion-menu
            id="opcion-tema"
            imagen="/src/assets/svg/moon.svg"
            texto="Modo Oscuro"
          >
          </opcion-menu>
        </li>
      </ul>
    </div>

    <div class="filtro-oscuro ocultar" id="filtro-oscuro"></div>

    <!-- Barra fija inferior de compra -->
    <aside
      class="barra-compra"
      id="barra-compra"
      aria-label="Resumen de compra"
    >
      <div class="barra-compra__resumen">
        <span class="barra-compra__cantidad" id="cantidad-compra"
          >0 artículos</span
        >
        <strong class="barra-compra__total" id="total-compra"
          >$0.00</strong
        >
      </div>
      <button
        type="button"
        class="barra-compra__boton"
        id="boton-comprar"
        disabled
      >
        Comprar
      </button>
    </aside>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
